services:
  # ─────────────────────────────────────────────────────────────
  # BACKEND — Node.js Docker Web Service
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: codeclash-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: JUDGE_TIMEOUT_MS
        value: 5000
      - key: JUDGE_MEMORY_MB
        value: 256
      - key: TEMP_DIR
        value: ./temp

  # ─────────────────────────────────────────────────────────────
  # FRONTEND — Static Site (Vite build, no Docker needed)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: codeclash-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    plan: free
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
