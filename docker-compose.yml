version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: codeclash-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: codeclash
    networks:
      - codeclash-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeclash-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/codeclash
      PORT: 5000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - temp_files:/app/temp
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - codeclash-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeclash-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - codeclash-net

volumes:
  mongo_data:
  temp_files:

networks:
  codeclash-net:
    driver: bridge
